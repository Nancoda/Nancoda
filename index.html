<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NANCODA</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      display: flex;
      height: 100vh;
      background-color: #313338;
      color: #dbdee1;
      overflow: hidden;
    }

    /* Sol Panel (Sunucu/Kanal Listesi) */
    #sidebar {
      width: 240px;
      background-color: #2b2d31;
      display: flex;
      flex-direction: column;
      border-right: 1px solid #1f2023;
    }

    .sidebar-header {
      padding: 16px;
      font-weight: bold;
      font-size: 16px;
      color: #f2f3f5;
      border-bottom: 1px solid #1f2023;
      box-shadow: 0 1px 2px rgba(0,0,0,0.2);
    }

    .channel-section {
      padding: 12px 8px 4px 8px;
      font-size: 12px;
      font-weight: bold;
      color: #949ba4;
      text-transform: uppercase;
    }

    .channel-btn {
      display: flex;
      align-items: center;
      padding: 8px 12px;
      margin: 2px 8px;
      border-radius: 4px;
      cursor: pointer;
      color: #949ba4;
      transition: background 0.2s, color 0.2s;
    }

    .channel-btn:hover {
      background-color: #35373c;
      color: #dbdee1;
    }

    .channel-btn.active {
      background-color: #404249;
      color: #ffffff;
    }

    .channel-icon {
      margin-right: 8px;
      font-size: 16px;
    }

    /* SES KANALINDAKİ ÜYELERİN LİSTESİ (DISCORD STAGE / VOICE STYLE) */
    .voice-members-list {
      margin: 2px 8px 8px 24px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .voice-member-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 4px 8px;
      border-radius: 4px;
      background-color: rgba(0, 0, 0, 0.15);
    }

    .voice-member-avatar {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      object-fit: cover;
      background-color: #5865f2;
    }

    .voice-member-name {
      font-size: 13px;
      color: #dbdee1;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Bottom Control Bar (Ses Durumu & Kullanıcı) */
    .user-panel {
      margin-top: auto;
      background-color: #232428;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .voice-status-box {
      background-color: #111214;
      padding: 8px 10px;
      border-radius: 6px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .voice-status-header {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: #23a55a;
      font-weight: bold;
    }

    .voice-channel-title {
      font-size: 11px;
      color: #949ba4;
    }

    .voice-controls {
      display: flex;
      gap: 6px;
      margin-top: 4px;
    }

    .btn {
      border: none;
      padding: 6px 12px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
      color: white;
    }

    .btn-green { background-color: #23a55a; }
    .btn-green:hover { background-color: #1d8a4b; }
    .btn-red { background-color: #da373c; }
    .btn-red:hover { background-color: #a1282c; }
    .btn-gray { background-color: #4e5058; }
    .btn-gray:hover { background-color: #6d6f78; }

    /* Ana Mesajlaşma Alanı */
    #chat-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      background-color: #313338;
    }

    .chat-header {
      height: 48px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      border-bottom: 1px solid #1f2023;
      font-weight: bold;
      box-shadow: 0 1px 2px rgba(0,0,0,0.2);
    }

    #messages-container {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .message-author {
      font-size: 13px;
      font-weight: bold;
      color: #f2f3f5;
    }

    .message-content {
      font-size: 14px;
      color: #dbdee1;
      line-height: 1.4;
    }

    .chat-input-container {
      padding: 16px;
      background-color: #313338;
    }

    .chat-input {
      width: 100%;
      padding: 12px 16px;
      background-color: #383a40;
      border: none;
      border-radius: 8px;
      color: #dbdee1;
      font-size: 14px;
      outline: none;
    }

    .chat-input::placeholder {
      color: #80848e;
    }
  </style>
</head>
<body>

  <audio id="remoteAudio" autoplay></audio>

  <!-- Sol Menü -->
  <div id="sidebar">
    <div class="sidebar-header">NANCODA</div>
    
    <div class="channel-section">Yazı Kanalları</div>
    <div class="channel-btn active" onclick="switchTextChannel('genel')">
      <span class="channel-icon">#</span> genel
    </div>
    <div class="channel-btn" onclick="switchTextChannel('duyurular')">
      <span class="channel-icon">#</span> duyurular
    </div>

    <div class="channel-section">Ses Kanalları</div>
    <div class="channel-btn" id="voice-btn-sohbet">
      <span class="channel-icon">🔊</span> Sesli Sohbet
    </div>

    <!-- Ses Kanalındaki Kullanıcılar Burada Listelenecek -->
    <div id="voice-members-container" class="voice-members-list"></div>

    <!-- Kullanıcı & Ses Durum Paneli -->
    <div class="user-panel">
      <div class="voice-status-box">
        <div class="voice-status-header">
          <span>●</span> <span id="voice-status-text">Devre Dışı</span>
        </div>
        <div class="voice-channel-title" id="voice-channel-name">Bağlı Değil</div>
        <div class="voice-controls">
          <button class="btn btn-green" id="join-voice-btn" onclick="joinVoice('Sesli Sohbet')">Katıl</button>
          <button class="btn btn-red" id="leave-voice-btn" style="display:none;" onclick="leaveVoice()">Ayrıl</button>
          <button class="btn btn-gray" id="toggle-mic-btn" style="display:none;" onclick="toggleMic()">🎤 Mute</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Ana Sohbet Alanı -->
  <div id="chat-area">
    <div class="chat-header">
      <span style="color:#80848e; margin-right:8px;">#</span>
      <span id="current-channel-title">genel</span>
    </div>

    <div id="messages-container"></div>

    <div class="chat-input-container">
      <input type="text" id="message-input" class="chat-input" placeholder="#genel kanalına mesaj gönder" onkeypress="handleKeyPress(event)" />
    </div>
  </div>

  <!-- Firebase Integration -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, push, onValue, set, get, child, onChildAdded, remove, onDisconnect } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // FIREBASE YAPILANDIRMASI
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_AUTH_DOMAIN",
      databaseURL: "YOUR_DATABASE_URL",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_STORAGE_BUCKET",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const currentServer = "nancoda";
    let currentTextChannel = "genel";
    let activeVoiceChannel = null;
    
    // Rastgele Kullanıcı Bilgisi (Avatar & Kullanıcı Adı)
    const randomId = Math.floor(Math.random() * 8999 + 1000);
    const currentUserId = "User_" + randomId;
    const currentUserAvatar = `https://api.dicebear.com/7.x/bottts/svg?seed=${currentUserId}`;

    let localStream = null;
    let peerConnection = null;
    let isMuted = false;

    const rtcConfig = {
      iceServers: [
        { urls: "stun:stun.l.google.com:19302" },
        { urls: "stun:stun1.l.google.com:19302" }
      ]
    };

    // --- YAZI SOHBETİ ---
    window.switchTextChannel = function(channelName) {
      currentTextChannel = channelName;
      document.getElementById('current-channel-title').innerText = channelName;
      document.getElementById('message-input').placeholder = `#${channelName} kanalına mesaj gönder`;
      loadMessages();
    };

    window.handleKeyPress = function(event) {
      if (event.key === 'Enter') {
        const input = document.getElementById('message-input');
        const text = input.value.trim();
        if (text !== "") {
          push(ref(db, `messages/${currentServer}/${currentTextChannel}`), {
            author: currentUserId,
            text: text,
            timestamp: Date.now()
          });
          input.value = "";
        }
      }
    };

    function loadMessages() {
      const messagesRef = ref(db, `messages/${currentServer}/${currentTextChannel}`);
      onValue(messagesRef, (snapshot) => {
        const container = document.getElementById('messages-container');
        container.innerHTML = "";
        const data = snapshot.val();
        if (data) {
          Object.values(data).forEach(msg => {
            const msgEl = document.createElement('div');
            msgEl.className = 'message';
            msgEl.innerHTML = `
              <div class="message-author">${msg.author}</div>
              <div class="message-content">${msg.text}</div>
            `;
            container.appendChild(msgEl);
          });
          container.scrollTop = container.scrollHeight;
        }
      });
    }

    // --- SES KANALI KULLANICILARINI CANLI DİNLEME (UI GÜNCELLEME) ---
    function listenVoiceMembers(channelName) {
      const membersRef = ref(db, `voiceMembers/${currentServer}/${channelName}`);
      onValue(membersRef, (snapshot) => {
        const container = document.getElementById('voice-members-container');
        container.innerHTML = "";
        const data = snapshot.val();
        if (data) {
          Object.values(data).forEach(member => {
            const memberEl = document.createElement('div');
            memberEl.className = 'voice-member-item';
            memberEl.innerHTML = `
              <img src="${member.avatar}" class="voice-member-avatar" />
              <span class="voice-member-name">${member.name}</span>
            `;
            container.appendChild(memberEl);
          });
        }
      });
    }

    // --- WEBRTC SESLİ SOHBET MANTIĞI ---
    window.joinVoice = async function(channelName) {
      if (activeVoiceChannel === channelName) return;
      if (activeVoiceChannel) leaveVoice();

      try {
        localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
        activeVoiceChannel = channelName;

        document.getElementById('voice-channel-name').innerText = channelName;
        document.getElementById('voice-status-text').innerText = "Bağlandı (Canlı)";
        document.getElementById('join-voice-btn').style.display = 'none';
        document.getElementById('leave-voice-btn').style.display = 'inline-block';
        document.getElementById('toggle-mic-btn').style.display = 'inline-block';

        // Kullanıcıyı ses kanalının üye listesine ekle
        const userMemberRef = ref(db, `voiceMembers/${currentServer}/${channelName}/${currentUserId}`);
        set(userMemberRef, {
          name: currentUserId,
          avatar: currentUserAvatar
        });
        
        // Sekme kapatılırsa Firebase'den otomatik sil
        onDisconnect(userMemberRef).remove();

        initWebRTC(channelName);
      } catch (err) {
        alert("Mikrofon izni engellendi veya ses cihazı bulunamadı!");
      }
    };

    function initWebRTC(channelName) {
      const signalRef = ref(db, `voiceSignals/${currentServer}/${channelName}`);

      peerConnection = new RTCPeerConnection(rtcConfig);

      localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

      peerConnection.ontrack = (event) => {
        const remoteAudio = document.getElementById('remoteAudio');
        remoteAudio.srcObject = event.streams[0];
        remoteAudio.play().catch(() => {});
      };

      peerConnection.onicecandidate = (event) => {
        if (event.candidate) {
          push(ref(db, `voiceSignals/${currentServer}/${channelName}/candidates/${currentUserId}`), event.candidate.toJSON());
        }
      };

      get(child(signalRef, 'offers')).then(snapshot => {
        const offers = snapshot.val() || {};
        const existingUserIds = Object.keys(offers);

        if (existingUserIds.length === 0) {
          peerConnection.createOffer().then(offer => {
            peerConnection.setLocalDescription(offer);
            set(ref(db, `voiceSignals/${currentServer}/${channelName}/offers/${currentUserId}`), offer);
          });
        } else {
          const targetUserId = existingUserIds[0];
          const offer = offers[targetUserId];

          peerConnection.setRemoteDescription(new RTCSessionDescription(offer)).then(() => {
            return peerConnection.createAnswer();
          }).then(answer => {
            peerConnection.setLocalDescription(answer);
            set(ref(db, `voiceSignals/${currentServer}/${channelName}/answers/${currentUserId}`), answer);
          });
        }
      });

      onValue(child(signalRef, 'answers'), snapshot => {
        const answers = snapshot.val() || {};
        Object.keys(answers).forEach(key => {
          if (key !== String(currentUserId) && peerConnection.signalingState === "have-local-offer") {
            peerConnection.setRemoteDescription(new RTCSessionDescription(answers[key]));
          }
        });
      });

      onChildAdded(child(signalRef, 'candidates'), snapshot => {
        const candGroup = snapshot.val() || {};
        Object.values(candGroup).forEach(cand => {
          if (cand && peerConnection) {
            peerConnection.addIceCandidate(new RTCIceCandidate(cand)).catch(() => {});
          }
        });
      });
    }

    window.toggleMic = function() {
      if (!localStream) return;
      isMuted = !isMuted;
      localStream.getAudioTracks()[0].enabled = !isMuted;
      const btn = document.getElementById('toggle-mic-btn');
      btn.innerText = isMuted ? "🎤 Unmute" : "🎤 Mute";
      btn.style.backgroundColor = isMuted ? "#da373c" : "#4e5058";
    };

    window.leaveVoice = function() {
      if (localStream) {
        localStream.getTracks().forEach(track => track.stop());
        localStream = null;
      }
      if (peerConnection) {
        peerConnection.close();
        peerConnection = null;
      }

      if (activeVoiceChannel) {
        remove(ref(db, `voiceSignals/${currentServer}/${activeVoiceChannel}/offers/${currentUserId}`));
        remove(ref(db, `voiceSignals/${currentServer}/${activeVoiceChannel}/answers/${currentUserId}`));
        remove(ref(db, `voiceMembers/${currentServer}/${activeVoiceChannel}/${currentUserId}`));
      }

      activeVoiceChannel = null;
      document.getElementById('voice-channel-name').innerText = "Bağlı Değil";
      document.getElementById('voice-status-text').innerText = "Devre Dışı";
      document.getElementById('join-voice-btn').style.display = 'inline-block';
      document.getElementById('leave-voice-btn').style.display = 'none';
      document.getElementById('toggle-mic-btn').style.display = 'none';
    };

    // Açılış Dinlemeleri
    loadMessages();
    listenVoiceMembers('Sesli Sohbet');
  </script>
</body>
</html>
